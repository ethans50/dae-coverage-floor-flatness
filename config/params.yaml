# config/params.yaml

global:
  # 패키지 외부의 데이터 저장소 경로. 홈 디렉토리에 있음.
  workspace_root: "~/dae_floor_maps"

# ==============================================================================
# [1. Mission Generation - Environment Modeling Component]
# ==============================================================================
environment_modeling:
  # [Global Settings]
  target_resolution: 0.02 # 맵의 해상도 (meter/pixel). 값이 작을수록 정밀하지만 계산량이 증가.
  dae_file: "INU_9_211.dae" # 분석 대상 3D 모델 파일명. (INU_9_211.dae, Apt.dae) 시뮬 world의 건물도 이 값을 따라감 - models/ 아래에 같은 이름의 Gazebo 모델이 있어야 함.

  # [Strict Directory Mappings]
  input_dir: "assets"
  output_grid_dir: "maps/grid"           # 2D OGM (.yaml, .pgm) 저장 경로
  output_topology_dir: "maps/topology"   # 공간 분할 Topological Graph (.npz) 저장 경로
  visualization_dir: "visualization/mission_generation/environment_modeling" # 디버깅 이미지
  
  # [Robot & Environment Constraints]
  robot_width: 0.15 # (m) 로봇 반경. 시각화에서 핑크 구역은 robot_width만 깎아낸 것임
  max_door_radius: 0.5 # 일반적인 방의 문 폭의 최대 너비의 절반: 1.0 / 2 = 0.5 (m)
  min_area_px: 100 # 분할된 조각이 너무 작아지는 것 방지.
  max_aspect_ratio: 8 # 공간의 최대 종횡비의 기준. 예를 들어 공간의 종횡비가 5 이상이라면, 지나치게 긴 공간으로 간주하여 분할함.

  # [Recursive Convexity Decomposition]
  # 공간의 convexity을 기준으로 L자, U자형 공간을 사각형에 가깝게 분할하는 로직
  convexity: 
    # 1. 분할 실행 임계값
    base_solidity_threshold: 0.84   # 기본 분할 기준 (Solidity). 1.0에 가까울수록 엄격하게(더 많이) 분할함.
    strict_solidity_threshold: 0.75 # 강제 분할 기준. 볼록성이 이 수치 미만이면 병목이 작아도 무조건 분할 시도.
    l_shape_ratio_threshold: 0.85   # (최소폭 / 평균폭)값이 이 값보다 작으면 L자 코너로 판단.
    
    # 2. Projection 분석 파라미터
    projection_margin_ratio: 0.1    # Projection 분석 시 무시할 양 끝단 비율. 0.1은 양쪽 10%씩 제외하고 중앙 80%에서 절단점 탐색.
    bottleneck_tolerance_ratio: 1.05 # 병목 구간 인정 오차 범위. 최솟값의 105% 이내 픽셀들을 모두 최적 절단 후보군으로 설정.
    
    # 3. 마스크 복원 및 필터링 (Dilation)
    # 절단된 노드들에 인접한 벽면 데이터를 안전하게 빠짐없이 배분하기 위한 설정
    dilation_kernel_size: 5         # 벽면 탐색을 위한 커널 크기 (pixel). 해상도가 높을수록 키우는 것을 권장.
    dilation_padding_px: 10         # 노드 확장 시의 추가 여유분 (pixel). 노드 크기의 절반 + 이 값만큼 확장하여 벽면 데이터를 수집함.

# ==============================================================================
# [2. Mission Generation - Mission Planning Component]
# ==============================================================================
mission_planner:
  lidar_vertical_fov_deg: 15.0 # 수직 FOV 절반
  lidar_mount_height: 0.338 # (m) base_footprint(지면) 기준 velodyne_link 높이. 실측하여 정확한 값을 기입바람.
  path_safety_margin: 0.25 # robot_width + path_safety_margin 만큼 경로가 벽에서 떨어져서 생성되도록 함.
  # local_costmap의 inflation_radius(0.25m, tb3_waffle_nav2_params.yaml)보다 여유가 부족하면
  # 벽 근접 지점에서 제자리 회전(Spin)이 사전 충돌 체크에 걸려 실패하므로 그 이상으로 둠.

  lidar_range: 3.0 # 라이다 측정 최대 범위 (m)
  overlap: 0.2 # 이동하면서 측정 시 오버랩할 비율
  
  # [Strict Directory Mappings]
  output_metric_dir: "analytics/metrics" # 생성된 최종 웨이포인트 (.json) 저장 경로
  visualization_dir: "visualization/mission_generation/mission_planning"

  turn_weight: 2.0
  wall_weight: 12.0

  # [Ablation 실험용 토글] 연구 기여점 정량 비교를 위해 각 메커니즘을 개별
  # on/off 가능하게 함. boundary repass는
  # mission_execution.enable_boundary_repass로 이미 토글 가능함.
  # 기본값(=평소/알고리즘3 "현재 알고리즘") 전부 true - 실험 후 반드시 이
  # 기본값으로 되돌릴 것.
  enable_pendant_reorder: true       # 기본값 true. true=Step2.5 허브-pendant 재정렬 적용, false=적용 안 하고 Christofides 순서 그대로 씀
  enable_entry_hint_ordering: true   # 기본값 true. true=노드 내 스와스 순서를 진입/진출 방향에 맞춰 정렬, false=방향과 무관하게 고정 순서로 정렬 (위와 동일)
  enable_path_simplification: true   # 기본값 true. true=A* transit 경로의 계단현상 제거(Douglas-Peucker) 적용, false=적용 안 해서 계단현상이 그대로 남음 (위와 동일)

  # [알고리즘 비교 실험용 토글] 3-way 비교(CentroidOnly/AllOff/Ours) 전용임.
  # 위 3개 토글 + mission_execution.enable_boundary_repass와 함께 조합해 사용함.
  # *** 기본값(평소 상태): coverage_mode="full", enable_optimal_swath_angle=true.
  # 실험 중 아래를 바꿨다면 실험이 끝나는 대로 반드시 이 기본값으로 되돌릴 것 -
  # 안 그러면 이후 모든 정상 미션이 조용히 centroid_only/zigzag 모드로 계속 돎. ***
  coverage_mode: "full"       # 기본값 "full". "full"=F2C로 노드 전체를 커버리지 스와스로 훑음, "centroid_only"=스와스 생성 없이 노드 중앙점 1점만 방문
  enable_optimal_swath_angle: true    # 기본값 true. true=wide 노드에서 generateBestSwaths로 최적 각도 자동탐색, false=각도 탐색 없이 0도 고정 스와스 (위와 동일)

# ==============================================================================
# [3. Mission Execution - Robot Driving & Tracking Component]
# ==============================================================================
mission_execution:
  # [Strict Directory Mappings]
  input_metric_dir: "analytics/metrics"  # 주행을 위해 읽어올 미션 웨이포인트 (.json) 경로
  output_path_dir: "analytics/paths"     # planning 경로 및 실주행 경로 비교 데이터 (.csv) 저장 경로
  visualization_dir: "visualization/mission_execution"

  post_localization_wait_sec: 3.0

  coverage_angular_dist_threshold: 0.780   # coverage 구간 - yaml 기본값과 동일(정밀 회전 유지)
  transit_angular_dist_threshold: 3.140    # transit 구간 - 사실상 강제 회전 비활성화

  coverage_speed_limit_mps: 0.16   # coverage 구간 - DWB의 FollowPath.max_vel_x/max_speed_xy로 들어감(측정 정밀도 검증된 속도 유지)
  transit_speed_limit_mps: 0.26    # transit 구간 - RPP의 FollowPathTransit.desired_linear_vel로 들어감. 캡처 없이 이동만 하므로 TB3 Waffle 모터 스펙상 최대 선속도까지 올림

  active_capture_seconds: 2.0
  min_rotation_deg: 3.0          # 이 이하 각도차는 회전 생략
  rotate_aim_min_dist_m: 0.15    # sub-segment 주행 전 회전 시 조준할 점을 고르는 최소 거리. 이보다 가까운 점은 atan2가 노이즈가 되므로 건너뜀
  spin_time_allowance_sec: 15.0
  tf_lookup_retry_sec: 1.0       # map->base_link TF 조회 실패 시 재시도할 최대 시간(초). 버퍼/리스너 생성 직후처럼 TF 이력이 아직 얕을 때의 일시적 ExtrapolationException을 흡수함.

  # imu_tilt_broadcaster가 IMU orientation에서 뺀 뒤 base_footprint->base_link TF에
  # 싣는 고정 바이어스(deg, [roll, pitch]). 실측 전이라 기본값 0 - 정지 상태 IMU
  # 바이어스를 측정해 채워야 함(lidar_mount_correction_rpy_deg와 같은 패턴).
  imu_mount_correction_rpy_deg: [0.0, 0.0]

  initial_pose_max_yaw_error_deg: 30.0  # AMCL 초기화 검증 시 위치는 맞아도 heading이 이보다 벌어지면 실패 처리. 실제 로봇을 출력된 runway heading과 다르게 놓으면 map->odom TF가 회전된 채 굳어 주행 전체가 삐뚤어짐(위치 오차 체크만으로는 못 잡히던 결함).

  direction_change_threshold_deg: 30.0 # 좁은 구역 측정 문제를 해결하기 위해 coverage/transit 무시함. 전체 경로를 대상으로, 30도 이상 방향이 바뀌는 지점으로 분할.

  # [Boundary Repass] 모든 coverage exit 지점(중간 노드 exit + 미션의 진짜
  # 마지막 지점)은 "멀어짐" 방향 시야가 구조적으로 보장되지 않아 blind cone이
  # 한쪽만 메워짐(utils/boundary_repass.py 참고). 미션의 진짜 첫 지점은
  # "접근" 방향 시야가 아예 없어 별도로 run_start_prepass가 보완함.
  # blind cone이 없는 센서로 교체되면 false로 꺼서 완전히 비활성화 가능.
  # 세그먼트 길이가 boundary_repass_max_segment_m 이하일 때만 실제로 되짚기를
  # 수행함 - 충분히 긴 구간은 진입 시 여러 라이다 링이 순차적으로 훑고 지나가는
  # 것만으로 완전성이 이미 확보되어 되짚기가 불필요함(utils/boundary_repass.py 참고).
  # 알고리즘 비교 실험에서 AllOff 조합에 쓰일 때만 false로 내리고, 실험 후
  # 반드시 true로 되돌릴 것(mission_planner의 coverage_mode/enable_optimal_swath_angle과 동일 규칙).
  enable_boundary_repass: true
  boundary_repass_distance_m: 3.0   # 왕복 거리 (m). blind_radius_m(약 1.26m)의 2배 이상이어야 blind cone을 충분히 덮어 다시 훑을 수 있음. 세그먼트가 이보다 짧으면 자동으로 세그먼트 길이에 맞춰 clamp됨.
  boundary_repass_max_segment_m: 2.8   # 이보다 긴 exit 세그먼트는 되짚기 자체를 스킵함. blind_radius_m의 2배(약 2.52m)를 clamp 계수 0.9로 나눈 값 - 이보다 짧으면 boundary_repass_distance_m이 세그먼트 길이에 clamp되어 blind cone을 다 못 덮음.

  # [Stall Logging] nav2 goToPose/goThroughPoses/Spin feedback을 blocking 대기
  # 루프 안에서 계속 폴링해, 진행 지표(distance_remaining/angular_distance_traveled)가
  # stall_log_threshold_sec 이상 전혀 바뀌지 않는 구간을 "지연"으로 기록함.
  # 미션이 끝나면(성공/실패/취소 무관) 그 목록만 stall_log_dir에 CSV로 따로
  # 저장된다(utils/stall_logger.py) - 다른 로그와 섞이지 않아 디버깅이 쉬움.
  stall_log_threshold_sec: 5.0
  stall_log_dir: "analytics/logs"

  # [Drive Debug Log] 미션 실행마다 새 파일(drive_debug_<날짜-시간>.csv)을
  # drive_debug_log_dir에 만들어, drive_debug_interval_sec 간격으로 "그 시점에 로봇이 정확히 뭘 하고
  # 있었는지"(현재 context - coverage 노드 id / transit 출발-도착 노드 /
  # prepass / end repass, 현재 TF pose, 활성 nav2 액션과 진행 지표, recoveries
  # 발동 횟수)를 계속 남김. drive_debug_stall_threshold_sec 이상 진행이 없으면
  # 그 구체적 원인 1차 진단(utils/mission_logger.py._build_stall_reason)까지
  # 같은 줄에 덧붙임. stall_log_dir의 사후 요약(stall_report_*.csv)과 달리
  # 미션 도중 실시간으로 계속 쌓여서, 프로세스가 중간에 죽어도 그때까지 기록이
  # 남음.
  drive_debug_log_dir: "analytics/logs"
  drive_debug_interval_sec: 3.0
  drive_debug_stall_threshold_sec: 9.0

  # [Spin Retry] boundary_repass 지점처럼 벽에 바짝 붙은 자리에서 Spin의 사전
  # 충돌 체크(behavior_server의 simulate_ahead_time, tb3_waffle_nav2_params.yaml)에
  # 걸려 즉시 실패하는 경우, 살짝 후진(BackUp)해 여유를 만든 뒤 1회만 재시도함
  # (_rotate_in_place_to/_backup_for_clearance).
  spin_retry_backup_dist_m: 0.15
  spin_retry_backup_speed_mps: 0.05
  backup_time_allowance_sec: 10.0

  # [Direct cmd_vel Rotate - 최종 폴백] Spin 1차 시도 + (후진 후) 재시도까지
  # 실패하면(혹은 후진 자체도 막히면), nav2 behavior_server를 아예 거치지 않고
  # /cmd_vel을 직접 발행해 제자리 회전시킴 - costmap 사전 충돌 체크를 하지
  # 않으므로 느린 속도로만 사용함(_direct_cmd_vel_rotate).
  direct_rotate_speed_rad_s: 0.3
  direct_rotate_timeout_sec: 20.0

  # [Direct cmd_vel Forward Creep - 최종 폴백 3단계] _navigate_through_poses_blocking이
  # 취소+후진+재시도(2단계)까지도 nav_stuck_cancel_sec 이상 진행이 없으면,
  # nav2를 아예 거치지 않고 /cmd_vel을 직접 발행해 현재 heading 그대로 짧게
  # 직진시킨 뒤 goThroughPoses를 마지막으로 한 번 더 재시도함 - costmap 사전
  # 충돌 체크를 안 하므로 느린 속도/짧은 거리로만 사용함
  # (_direct_cmd_vel_creep_forward).
  direct_creep_speed_mps: 0.05
  direct_creep_distance_m: 0.2
  direct_creep_timeout_sec: 15.0

  # [Stuck Nav Watchdog] nav2 기본 recovery BT는 스스로 포기하는 시점이 없어서
  # (RoundRobin으로 spin/wait/backup을 계속 재시도), 좁은 문지방 등에서 막히면
  # number_of_recoveries만 계속 늘려가며 사실상 무한 대기할 수 있음
  # 그래서 _navigate_to_pose_blocking/
  # _navigate_through_poses_blocking이 nav_stuck_cancel_sec 이상 진행이 없으면
  # 직접 취소하고, 후진 후 1회 재시도, 그래도 막히면(_navigate_through_poses_blocking만)
  # 위 direct cmd_vel forward creep으로 한 번 더 시도한 뒤에야 세그먼트 실패로 처리함.
  nav_stuck_cancel_sec: 45.0

# ==============================================================================
# [4. Surface Profiling - 3D Measurement & Evaluation Component]
# ==============================================================================
surface_profiling:
  # [Strict Directory Mappings]
  pointcloud_dir: "analytics/pointclouds"  # 로우 PCD 및 정렬/필터링된 바닥면 수치 데이터 저장 경로
  visualization_dir: "visualization/surface_profiling" # 최종 평탄도 히트맵 이미지 (.png) 저장 경로
  map_yaml_dir: "maps/grid"

  # [ROS2 Topic & TF Settings]
  pcd_topic_sim: "/velodyne_points"   # Gazebo 시뮬레이션 환경에서의 3D 라이다 토픽
  pcd_topic_real: "/velodyne_points"  # 실제 Velodyne VLP-16 하드웨어 토픽
  target_frame: "map"              # TF lookup 목표 좌표계 (전역 좌표계)
  source_frame: "velodyne_link"    # TF lookup 원본 좌표계 (3D 라이다 센서 좌표계)
  tf_timeout_sec: 0.5              # TF lookup 허용 대기 시간 (초). Chrony 시간 동기화 정밀도에 의존함.

  only_capture_at_waypoints: true
  enable_tf_lowpass_filter: true
  tf_lowpass_max_linear_vel: 0.3       # m/s
  tf_lowpass_max_angular_vel_deg: 20.0  # deg/s

  # [Point Cloud Processing]
  voxel_size: 0.01      # (m) PCD 저장 시 다운샘플링 단위. 메모리 초과 방지용.
  save_raw_pcd: false   # true면 다운샘플 이전 raw PCD를 combined_raw_*.pcd로 별도 저장함
  # 아래 둘은 디스크 절약용 토글임. combined_*.pcd만 남겨두면 z 창/격자/분모를
  # 바꿔도 재주행 없이 reprocess_pcd.py/analyze_coverage_comparison.py로 다시
  # 계산할 수 있음.
  save_combined_csv: false   # true면 통합 PCD를 combined_*.csv로도 내보냄(외부 툴 전달용)
  save_waypoint_pcd: false   # true면 웨이포인트별 개별 PCD를 pointclouds/waypoints/에 저장함(지점 단위 디버깅용)
  # save_raw_pcd는 알고리즘 비교 실험용임 - 셀당 다중 리턴 수/z-표준편차 계산에
  # 필요하며, 평소에는 용량 때문에 꺼둠.
  # 바닥면 점군은 z=0.000을 중심으로 대칭으로 퍼져 있어(피크 -0.024~+0.015)
  # z 창도 대칭으로 잡아야 함 - 하단을 자르면 완전성과 평탄도가 함께 치우침.
  # 이 두 값은 완전성 계산뿐 아니라 combined_filtered_*.pcd
  # 생성과 평탄도 히트맵에도 그대로 쓰이므로 바닥 피크를 대칭으로 감싸야 함.
  z_min: -0.010         # (m) -2.5cm. 바닥 피크 하단(-0.024)을 포함시킴.
  z_max: 0.010          # (m) +3.0cm. 바닥 피크 상단보다 여유를 둬 볼록한 요철까지 담음.
  # 상한을 올릴수록 벽/물체 하단의 배경 점이 벽 근처 셀에 섞일 수 있음.
  # z-이상치 삽입 실험 시에는 주입할 결함 높이가 이 상한에 잘리지 않는지 확인할 것.

  # [LiDAR Mount Correction]
  # TF가 알려주는 velodyne_link 자세와 실제 센서 자세의 고정 오프셋 보정(단위 deg, [roll, pitch, yaw],
  # URDF joint rpy와 같은 규약으로 센서 좌표계에 추가 회전을 곱함). 바닥이 평평한데도 z가
  # 센서로부터 멀어질수록 한쪽으로 기우는 오차가 있으면 analyze_z_bias.py를 돌려 출력되는
  # 제안값을 그대로 넣음. 보정 후 같은 스크립트로 pitch/roll이 0에 가까워졌는지 확인함.
  # sim은 차체 정적 기울기로 측정했고, real은 실측 전이라 0으로 둠.
  lidar_mount_correction_rpy_deg_sim: [0.0, -0.146, 0.0]
  lidar_mount_correction_rpy_deg_real: [0.351, -0.396, 0.0]

  # [Frame-level Log & Accumulation Video]
  # 다운샘플 이전의 map 좌표 점을 프레임(stamp, 센서 pose, 캡처 여부, 저역통과 기각
  # 여부)별로 pointclouds/frames/frames_*.npz에 저장함. 셀별 점 수/통과 횟수 분석
  # (analyze_frame_log.py)과 누적 영상의 입력임. 메모리 절약을 위해 점은 z 밴드
  # [frame_log_z_min, frame_log_z_max]만 남기며, 이 밴드는 z_min/z_max(바닥 z 창)보다
  # 충분히 넓어야 z가 떠서 창에 잘린 점도 구분할 수 있음.
  save_frame_log: true
  frame_log_z_min: -0.5     # (m)
  frame_log_z_max: 0.5      # (m)
  frame_log_store_transit_points: false  # true면 이동(transit) 프레임의 점도 저장함(메모리 큼)
  save_accumulation_video: true          # 주행 종료 후 top-down 누적 영상(.mp4)을 visualization_dir에 생성함
  video_z_margin: 0.12      # (m) z 창 밖으로 이만큼까지 표시함(셀에 창 밖 점만 있으면 아래=회색, 위=자홍)
  video_fps: 30
  video_max_frames: 1500    # 영상 프레임 수 상한(넘으면 균등 간격으로 솎음)
  video_max_dim_px: 1600    # 영상 긴 변의 최대 픽셀 수

  # [Heatmap Visualization]
  grid_size: 0.01        # (m) 히트맵 격자 크기. 작을수록 선명하지만 계산량 증가.
